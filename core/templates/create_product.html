{% extends 'base.html' %}
{% block title %} Create Product {% endblock %}


{% block content %}
<form method="POST">

    <!-- For verifying the Post Request we use csrf tokens -->
    {% csrf_token %}
    
    <label>Name: </label>
    <input type="text" name="name">

    <br> <br>
    <label>Price: </label>
    <input type="number" name="price">

    <br> <br>
    <label>Quantity: </label>
    <input type="number" name="quantity">

    <br> <br>
    {% if error %}
    <p style="color:red;">{{error}}</p>
    {% endif %}
    <button type="submit">
        Add Product
    </button>
</form>


{% endblock %}
