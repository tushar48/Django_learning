{% extends 'base.html' %}

{% block title %} {{product.name}} {% endblock %}

{% block content %}

<h1>Product Details for {{product.name}}</h1>
<p>Price : {{product.price}}</p>
<p>Quantity : {{product.quantity}}</p>


<a href="{% url 'products' %}"> Back to products </a>

{% endblock %}
